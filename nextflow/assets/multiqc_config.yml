# MultiQC configuration for the PBMC3k Scanpy pipeline.
# The step-wise custom content (*_mqc.json) files are written by
# analysis/pbmc3k_scanpy.py and auto-detected by MultiQC.

title: "PBMC3k — Scanpy QC report"
subtitle: "3k PBMCs from a Healthy Donor · quality control, marker genes and cell-type composition"
intro_text: |
  Report generated by the Nextflow pipeline `nextflow/main.nf`. Each step of the
  Scanpy workflow (QC → normalization → PCA/UMAP → Leiden clustering →
  annotation) publishes MultiQC custom content that is aggregated here.

# Keep the Scanpy sections on top, in pipeline order.
report_section_order:
  scanpy_qc_summary:
    order: -1000
  scanpy_marker_genes:
    order: -900
  scanpy_celltype_proportions:
    order: -800
